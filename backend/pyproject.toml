[project]
name = "atrium"
version = "1.0.0"
description = "Cabinet de prédiction cardiovasculaire"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=2.0",
  "joblib>=1.4",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "openpyxl>=3.1.5",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

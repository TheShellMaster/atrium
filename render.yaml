# Blueprint Render : API FastAPI uniquement. L'interface est sur Vercel.
services:
  - type: web
    name: atrium
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "7860"
      - key: ATRIUM_FRONTEND_URL
        value: "https://atrium-chi-flax.vercel.app"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

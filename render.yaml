# Blueprint Render : https://render.com/docs/blueprint-spec
# Déploiement tout-en-un (API FastAPI + modèle + interface) sur le plan gratuit, depuis le Dockerfile.
services:
  - type: web
    name: atrium
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "7860"
      - key: ATRIUM_STATIC_DIR
        value: /app/static
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
